<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OFLY TOOL · 极简暗色仪表盘</title>
<style>
  :root{
    --bg:#0d1117;--surface:#161b22;--surface-2:#1c2128;
    --border:#21262d;--border-2:#30363d;
    --text:#e6edf3;--muted:#8b949e;--faint:#6e7681;
    --accent:#58a6ff;--green:#3fb950;--amber:#d29922;--red:#f85149;
    --radius:8px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Inter","Segoe UI",Roboto,sans-serif;
    min-height:100vh;display:flex;flex-direction:column;
  }
  .mono{font-family:"SF Mono",ui-monospace,Menlo,Consolas,monospace}
  header{
    display:flex;align-items:center;gap:18px;
    padding:0 24px;height:56px;
    border-bottom:1px solid var(--border);background:var(--surface);
    flex:none;
  }
  .logo{display:flex;align-items:center;gap:9px;font-weight:600;font-size:15px}
  .logo .dot{width:10px;height:10px;border-radius:3px;background:var(--accent);box-shadow:0 0 10px rgba(88,166,255,.5)}
  .search{
    margin-left:auto;display:flex;align-items:center;gap:8px;
    background:var(--bg);border:1px solid var(--border);border-radius:6px;
    padding:7px 12px;width:280px;color:var(--faint);font-size:13px;
  }
  .status{display:flex;align-items:center;gap:8px;background:var(--bg);border:1px solid var(--border);border-radius:999px;padding:5px 12px;font-size:12px;color:var(--muted)}
  .status .g{width:7px;height:7px;border-radius:50%;background:var(--green)}
  .av{width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,var(--accent),#bc8cff);display:grid;place-items:center;font-size:12px;font-weight:600}
  .wrap{flex:1;display:flex;min-height:0}
  nav{
    width:220px;flex:none;border-right:1px solid var(--border);
    padding:18px 12px;display:flex;flex-direction:column;gap:2px;
  }
  nav .h{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);padding:6px 10px}
  nav a{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:6px;color:var(--muted);text-decoration:none;font-size:13.5px;border:1px solid transparent}
  nav a:hover{background:var(--surface);color:var(--text)}
  nav a.active{background:var(--surface-2);color:var(--text);border-color:var(--border)}
  nav a.active i{background:var(--accent)}
  nav a i{width:8px;height:8px;border-radius:2px;background:var(--border-2);flex:none}
  nav .sp{flex:1}
  nav .meta{border-top:1px solid var(--border);padding:12px 10px 4px;font-size:12px;color:var(--faint);line-height:1.9}
  main{flex:1;padding:24px;overflow:auto;min-width:0}
  .bread{font-size:13px;color:var(--muted);margin-bottom:18px}
  .bread b{color:var(--text);font-weight:500}
  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px}
  @media(max-width:900px){.stats{grid-template-columns:repeat(2,1fr)}}
  .stat{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px}
  .stat .k{font-size:12px;color:var(--muted)}
  .stat .v{font-size:22px;font-weight:600;margin-top:6px}
  .stat .v small{font-size:12px;color:var(--faint);font-weight:400}
  .stat .t{height:3px;border-radius:2px;background:var(--border);margin-top:10px;overflow:hidden}
  .stat .t i{display:block;height:100%;background:var(--accent)}
  .panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden}
  .phead{display:flex;align-items:center;gap:10px;padding:13px 18px;border-bottom:1px solid var(--border)}
  .phead .t{font-size:14px;font-weight:600}
  .phead .tag{margin-left:auto;font-size:11px;color:var(--muted);border:1px solid var(--border);padding:3px 8px;border-radius:999px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  @media(max-width:840px){.grid2{grid-template-columns:1fr}}
  .cell{display:flex;flex-direction:column}
  .cell .cap{font-size:12px;color:var(--muted);padding:12px 18px 0}
  textarea,pre{background:var(--bg);border:none;width:100%;color:var(--text);font-family:"SF Mono",ui-monospace,Menlo,monospace;font-size:13px;line-height:1.7;padding:14px 18px;resize:none;min-height:280px}
  textarea:focus{outline:none;box-shadow:inset 0 0 0 1px var(--accent)}
  textarea::placeholder{color:var(--faint)}
  pre{margin:0;min-height:0;color:var(--green)}
  .acts{display:flex;gap:10px;margin-top:14px}
  .btn{background:var(--accent);border:none;color:#0d1117;font-weight:600;font-size:13.5px;padding:8px 16px;border-radius:6px;cursor:pointer}
  .btn:hover{background:#79b8ff}
  .btn.gh{background:transparent;color:var(--muted);border:1px solid var(--border-2)}
  .btn.gh:hover{color:var(--text);border-color:var(--faint)}
</style>
</head>
<body>
<header>
  <div class="logo"><span class="dot"></span>OFLY TOOL</div>
  <div class="search">⌕ &nbsp;搜索工具…</div>
  <div class="status"><span class="g"></span>本地服务运行中</div>
  <div class="av">L</div>
</header>
<div class="wrap">
  <nav>
    <div class="h">工具</div>
    <a class="active" href="#"><i></i>JSON 格式化</a>
    <a href="#"><i></i>Hash 生成器</a>
    <a href="#"><i></i>正则测试器</a>
    <a href="#"><i></i>Base64 编解码</a>
    <a href="#"><i></i>时间戳转换</a>
    <a href="#"><i></i>URL 编码</a>
    <div class="sp"></div>
    <div class="meta">
      端口 8080 · nginx<br>
      运行时长 03:47<br>
      <span style="color:var(--green)">● 一切正常</span>
    </div>
  </nav>
  <main>
    <div class="bread">工具 / <b>JSON 格式化</b></div>
    <div class="stats">
      <div class="stat"><div class="k">已启用工具</div><div class="v">6</div><div class="t"><i style="width:100%"></i></div></div>
      <div class="stat"><div class="k">内存占用</div><div class="v">42<small>%</small></div><div class="t"><i style="width:42%;background:var(--amber)"></i></div></div>
      <div class="stat"><div class="k">请求/分钟</div><div class="v">0.3</div><div class="t"><i style="width:18%"></i></div></div>
      <div class="stat"><div class="k">本地延迟</div><div class="v mono">1.2<small>ms</small></div><div class="t"><i style="width:6%"></i></div></div>
    </div>
    <div class="grid2">
      <div class="panel">
        <div class="phead"><span class="t">输入</span><span class="tag">raw</span></div>
        <div class="cell">
          <textarea spellcheck="false" placeholder='{"name":"ofly","tools":["json","hash"],"online":true}'>{&quot;name&quot;:&quot;ofly&quot;,&quot;tools&quot;:[&quot;json&quot;,&quot;hash&quot;],&quot;online&quot;:true}</textarea>
        </div>
      </div>
      <div class="panel">
        <div class="phead"><span class="t">输出</span><span class="tag" style="color:var(--green)">有效 ✓</span></div>
        <div class="cell">
          <pre>{
  "name": "ofly",
  "tools": [
    "json",
    "hash"
  ],
  "online": true
}</pre>
        </div>
      </div>
    </div>
    <div class="acts">
      <button class="btn">格式化 JSON</button>
      <button class="btn gh">复制结果</button>
    </div>
  </main>
</div>
</body>
</html>
